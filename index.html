<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The OH Build Guild page has moved." />
    <title>This page has moved | OH Build Guild</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background: #f6f8fa;
        color: #1f2328;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      main {
        max-width: 560px;
        padding: 48px;
        border: 1px solid #d0d7de;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 6vw, 3rem);
      }

      p {
        margin: 0 0 32px;
        color: #59636e;
        font-size: 1.125rem;
      }

      .redirect-button {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 6px;
        background: #0969da;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }

      .redirect-button:hover {
        background: #0860ca;
      }

      .redirect-button:focus-visible {
        outline: 3px solid #54aeff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This page has moved</h1>
      <p>Visit the new OH Build Guild site to continue.</p>
      <a class="redirect-button" href="https://msftaustin.github.io/OHBuildGuild/">
        Go to the new site
      </a>
    </main>
  </body>
</html>
